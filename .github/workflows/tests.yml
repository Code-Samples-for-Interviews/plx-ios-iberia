name: CI iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancelamos revisiones antiguas de una PR, pero no interrumpimos una entrega en main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Ejecutar Swift Testing y XCTest en GitHub Actions.
  tests:
    name: Tests iOS
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # Xcode y destino explícitos para poder reproducir el entorno.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Mostrar la versión de Xcode
        run: xcodebuild -version

      - name: Ejecutar los tests
        run: |
          xcodebuild test \
            -project AlbumSearch/AlbumSearch.xcodeproj \
            -scheme AlbumSearch \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=26.2' \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Guardar el resultado de las pruebas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: resultados-tests-ios
          path: ${{ runner.temp }}/TestResults.xcresult
          retention-days: 7
          if-no-files-found: warn

  # Entregar a TestFlight solo después de pasar los tests.
  delivery:
    name: Entrega a TestFlight
    needs: tests
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.TESTFLIGHT_ENABLED == 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Descargar el código probado
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Archivar y subir a App Store Connect
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bash scripts/deliver-testflight.sh
